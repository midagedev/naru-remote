name: NaruRemote
options:
  bundleIdPrefix: com.naruremote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  NaruRemoteCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaruRemote/Sources/NaruRemoteCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.naruremote.core
        SKIP_INSTALL: YES
  NaruRemoteApp:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaruRemote/App
    dependencies:
      - target: NaruRemoteCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.naruremote.appshell
        SKIP_INSTALL: YES
  NaruRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaruRemote/iOSApp
    dependencies:
      - target: NaruRemoteApp
      - target: NaruRemoteCore
    info:
      path: NaruRemote/iOSApp/Info.plist
      properties:
        CFBundleDisplayName: Naru Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: >-
          Naru Remote은 Tailscale 등 사설망에 있는 컴퓨터에 VNC로
          연결하기 위해 로컬 네트워크 접근이 필요합니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naruremote.app
  NaruRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaruRemote/UITests
    dependencies:
      - target: NaruRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.naruremote.uitests
        TEST_TARGET_NAME: NaruRemote
  NaruRemoteBenchmarkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaruRemote/Tests/NaruRemoteBenchmarkTests
    dependencies:
      - target: NaruRemoteApp
      - target: NaruRemoteCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.naruremote.benchmarks
schemes:
  NaruRemote:
    build:
      targets:
        NaruRemote: all
        NaruRemoteUITests: [test]
        NaruRemoteBenchmarkTests: [test]
    test:
      targets:
        - NaruRemoteBenchmarkTests
        - NaruRemoteUITests
      environmentVariables:
        NARU_RUN_SIM_BENCHMARKS: "$(NARU_RUN_SIM_BENCHMARKS)"
        NARU_SIM_BENCHMARK_ITERATIONS: "$(NARU_SIM_BENCHMARK_ITERATIONS)"
        NARU_HELPER_VIDEO_INPUT_BENCHMARK_SAMPLES: "$(NARU_HELPER_VIDEO_INPUT_BENCHMARK_SAMPLES)"
        NARU_PROFILE_PREVIEW_BENCHMARK_SAMPLES: "$(NARU_PROFILE_PREVIEW_BENCHMARK_SAMPLES)"
        NARU_STAGED_UPLOAD_BENCHMARK_SAMPLES: "$(NARU_STAGED_UPLOAD_BENCHMARK_SAMPLES)"
        NARU_PIP_SAMPLE_BUFFER_BENCHMARK_SAMPLES: "$(NARU_PIP_SAMPLE_BUFFER_BENCHMARK_SAMPLES)"
