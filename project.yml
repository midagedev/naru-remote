name: NaruRemote
options:
  bundleIdPrefix: com.naruremote
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CURRENT_PROJECT_VERSION: 9
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: 6.0
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  NaruRemoteCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaruRemote/Sources/NaruRemoteCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.naruremote.core
        SKIP_INSTALL: YES
  NaruRemoteApp:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaruRemote/App
    dependencies:
      - target: NaruRemoteCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.naruremote.appshell
        SKIP_INSTALL: YES
  NaruRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaruRemote/iOSApp
    dependencies:
      - target: NaruRemoteApp
      - target: NaruRemoteCore
    info:
      path: NaruRemote/iOSApp/Info.plist
      properties:
        CFBundleDisplayName: Naru Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: >-
          Naru Remote uses your local network to connect directly to VNC
          computers on your private network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naruremote.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Device signing proven on physical iPhone 2026-07-05 (team XEF9KH7N43,
        # -allowProvisioningUpdates). Automatic style keeps simulator builds working.
        DEVELOPMENT_TEAM: XEF9KH7N43
        CODE_SIGN_STYLE: Automatic
  NaruRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaruRemote/UITests
    dependencies:
      - target: NaruRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.naruremote.uitests
        TEST_TARGET_NAME: NaruRemote
        DEVELOPMENT_TEAM: XEF9KH7N43
        CODE_SIGN_STYLE: Automatic
  NaruRemoteBenchmarkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NaruRemote/Tests/NaruRemoteBenchmarkTests
    dependencies:
      - target: NaruRemoteApp
      - target: NaruRemoteCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.naruremote.benchmarks
        DEVELOPMENT_TEAM: XEF9KH7N43
        CODE_SIGN_STYLE: Automatic
schemes:
  NaruRemote:
    build:
      targets:
        NaruRemote: all
        NaruRemoteUITests: [test]
        NaruRemoteBenchmarkTests: [test]
    test:
      targets:
        - NaruRemoteBenchmarkTests
        - NaruRemoteUITests
      environmentVariables:
        NARU_RUN_SIM_BENCHMARKS: "$(NARU_RUN_SIM_BENCHMARKS)"
        NARU_SIM_BENCHMARK_ITERATIONS: "$(NARU_SIM_BENCHMARK_ITERATIONS)"
        NARU_HELPER_VIDEO_INPUT_BENCHMARK_SAMPLES: "$(NARU_HELPER_VIDEO_INPUT_BENCHMARK_SAMPLES)"
        NARU_PROFILE_PREVIEW_BENCHMARK_SAMPLES: "$(NARU_PROFILE_PREVIEW_BENCHMARK_SAMPLES)"
        NARU_STAGED_UPLOAD_BENCHMARK_SAMPLES: "$(NARU_STAGED_UPLOAD_BENCHMARK_SAMPLES)"
        NARU_PIP_SAMPLE_BUFFER_BENCHMARK_SAMPLES: "$(NARU_PIP_SAMPLE_BUFFER_BENCHMARK_SAMPLES)"
