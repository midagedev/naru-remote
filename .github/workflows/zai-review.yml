name: Z.ai Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: zai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_BASE_URL: https://api.z.ai/api/anthropic
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ZAI_API_KEY }}
      API_TIMEOUT_MS: '3000000'
      ANTHROPIC_DEFAULT_SONNET_MODEL: glm-4.7
      ANTHROPIC_DEFAULT_OPUS_MODEL: glm-4.7
      ANTHROPIC_DEFAULT_HAIKU_MODEL: glm-4.5-air
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read review prompt
        id: prompt
        run: |
          {
            echo 'prompt<<NARU_PROMPT_EOF'
            cat .github/zai-review-prompt.md
            echo 'NARU_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ZAI_API_KEY }}
          prompt: ${{ steps.prompt.outputs.prompt }}
